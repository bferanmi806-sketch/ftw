name: repo hygiene

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  planning-docs:
    name: no agent planning documents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for planning artefacts
        env:
          PLANNING_DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/check-no-planning-docs.sh

  telemetry-reads:
    name: no new direct telemetry reads
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Count direct reads of cached telemetry
        env:
          TELEMETRY_READS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/check-telemetry-reads.sh
